# Static serving for the built SPA.
#
# Only two things matter here. The history fallback, because React Router owns
# the paths and a hard refresh on /ticket/123 must not 404. And the absence of
# any API proxy: the reverse proxy in front decides what goes to the backend,
# so this container never needs to know where it lives.

server {
    listen 3330;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
